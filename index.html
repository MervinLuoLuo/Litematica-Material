<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="description" content="读取 Minecraft Litematica 导出的材料 CSV，展示缺口数量并换算为组与潜影盒。">
<title>Litematica材料清单</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="ambient" aria-hidden="true"></div>

<header class="site-header reveal">
  <div class="wrap">
    <div class="bar" aria-hidden="true"></div>
    <p class="kicker">Litematica · Material List</p>
    <h1 class="title">材料清单</h1>
</header>

<main class="wrap">

  <section id="dropzone" class="dropzone reveal" tabindex="0" role="button" aria-label="上传 CSV 文件">
    <svg viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M128 176V80"></path>
      <path d="M88 112l40-40 40 40"></path>
      <path d="M56 208h144"></path>
    </svg>
    <p class="main">把 Litematica 导出的材料 CSV 拖到这里</p>
    <p class="hint">仅读取 Item / Total / Missing 三列 · Available 及多余字段将被忽略</p>
    <div class="actions">
      <button type="button" id="pickBtn" class="btn">选择 CSV 文件</button>
      <button type="button" id="pasteBtn" class="btn ghost">粘贴 CSV 文本</button>
    </div>
    <input type="file" id="fileInput" accept=".csv,text/csv,text/plain" hidden>
  </section>

  <div id="errorBox" class="error" role="alert"></div>

  <section id="pastePanel" class="paste reveal" hidden>
    <textarea id="pasteArea" placeholder="在此粘贴 CSV 内容，例如：&#10;&quot;Item&quot;,&quot;Total&quot;,&quot;Missing&quot;,&quot;Available&quot;&#10;&quot;石头按钮&quot;,1320,1283,0"></textarea>
    <div class="paste-actions">
      <button type="button" id="parsePasteBtn" class="btn">解析</button>
      <button type="button" id="cancelPasteBtn" class="btn ghost">取消</button>
    </div>
  </section>

  <section id="result" class="result reveal">
    <div class="result-head">
      <div>
        <p class="kicker">Material List</p>
        <h2 id="fileName">materials.csv</h2>
      </div>
      <button type="button" id="resetBtn" class="btn ghost">重新上传</button>
    </div>

    <div class="stats">
      <div class="stat"><span class="num" id="statKinds">0</span><span class="lbl">材料种类</span></div>
      <div class="stat"><span class="num" id="statMissing">0</span><span class="lbl">缺口总计 · 个</span></div>
      <div class="stat"><span class="num" id="statStacks">0</span><span class="lbl">约需组数 · 上取整</span></div>
      <div class="stat"><span class="num" id="statDone">—</span><span class="lbl">完成度</span></div>
    </div>

    <div class="controls">
      <input type="search" id="search" placeholder="搜索材料名称…" autocomplete="off">
      <select id="sort" aria-label="排序方式">
        <option value="missing">缺口从多到少</option>
        <option value="total">总量从多到少</option>
        <option value="name">按名称排序</option>
      </select>
    </div>
    <p id="countLine" class="count-line">共 0 种材料</p>

    <ul id="grid" class="grid"></ul>
  </section>
</main>

<noscript><p style="text-align:center;padding:24px;color:#787774">本页面需要启用 JavaScript 才能运行。</p></noscript>

<script src="app.js"></script>
</body>
</html>
