<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="description" content="读取 Minecraft Litematica 导出的材料 CSV，展示缺口数量并换算为组与潜影盒，档案保存在服务器可跨设备同步。">
<title>Litematica 可视化材料</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="ambient" aria-hidden="true"></div>

<header class="site-header reveal">
  <div class="wrap">
    <div class="header-top">
      <div>
        <div class="bar" aria-hidden="true"></div>
        <p class="kicker">Litematica · Material List</p>
        <h1 class="title">Litematica 可视化材料</h1>
        <p class="subtitle"> </p>
      </div>
      <div class="archive-controls">
        <span id="modeBadge" class="mode-badge" hidden></span>
        <select id="archiveSelect" aria-label="选择档案"></select>
        <button type="button" id="newArchiveBtn" class="btn">新建档案</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">

  <div id="errorBox" class="error" role="alert"></div>

  <section id="dropzone" class="dropzone reveal" tabindex="0" role="button" aria-label="上传 CSV 文件">
    <svg viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M128 176V80"></path>
      <path d="M88 112l40-40 40 40"></path>
      <path d="M56 208h144"></path>
    </svg>
    <p class="main">把 Litematica 导出的材料 CSV 拖到这里，保存为档案</p>
    <p class="hint">档案保存在服务器，可跨设备同步 · 需准备数 = Missing − Available</p>
    <div class="actions">
      <button type="button" id="pickBtn" class="btn">选择 CSV 文件</button>
      <button type="button" id="pasteBtn" class="btn ghost">粘贴 CSV 文本</button>
    </div>
    <input type="file" id="fileInput" accept=".csv,text/csv,text/plain" hidden>
  </section>

  <section id="result" class="result reveal">
    <div class="archive-info">
      <div>
        <p class="kicker">Archive</p>
        <h2 id="archiveName"></h2>
        <p id="archiveDesc" class="archive-desc" hidden></p>
      </div>
      <div class="archive-actions">
        <button type="button" id="editArchiveBtn" class="btn ghost">编辑档案</button>
        <button type="button" id="deleteArchiveBtn" class="btn ghost danger">删除档案</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><span class="num" id="statKinds">0</span><span class="lbl">材料种类</span></div>
      <div class="stat"><span class="num" id="statMissing">0</span><span class="lbl">需准备总计 · 个</span></div>
      <div class="stat"><span class="num" id="statStacks">0</span><span class="lbl">约需组数 · 0.5 步取整</span></div>
      <div class="stat"><span class="num num-sm" id="statShulker">0 盒 0 组</span><span class="lbl">潜影盒 + 余组 · 下取整</span></div>
      <div class="stat"><span class="num" id="statDone">—</span><span class="lbl">完成度</span></div>
    </div>

    <div class="controls">
      <select id="filter" aria-label="筛选方式">
        <option value="all">展示全部</option>
        <option value="undone">仅展示未收集完成</option>
        <option value="done">仅展示已收集完成</option>
      </select>
      <input type="search" id="search" placeholder="搜索材料名称…" autocomplete="off">
      <select id="sort" aria-label="排序方式">
        <option value="need">需准备从多到少</option>
        <option value="total">总量从多到少</option>
        <option value="name">按名称排序</option>
      </select>
    </div>
    <p id="countLine" class="count-line">共 0 种材料</p>

    <ul id="grid" class="grid"></ul>
  </section>

</main>

<!-- 新建 / 编辑档案弹窗 -->
<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">新建档案</h2>
    <label>档案名
      <input type="text" id="modalName" placeholder="例如：主城建造计划" autocomplete="off">
    </label>
    <label>档案描述
      <textarea id="modalDesc" rows="2" placeholder="可选，简单记录这个档案的用途"></textarea>
    </label>
    <label>CSV 内容
      <textarea id="modalCsv" rows="8" placeholder="粘贴 Litematica 导出的 CSV 内容，或点击下方按钮上传文件"></textarea>
    </label>
    <p id="modalError" class="modal-error" hidden></p>
    <div class="modal-actions">
      <button type="button" id="modalUploadBtn" class="btn ghost">上传 CSV 文件</button>
      <input type="file" id="modalFileInput" accept=".csv,text/csv,text/plain" hidden>
      <span class="modal-spacer"></span>
      <button type="button" id="modalCancelBtn" class="btn ghost">取消</button>
      <button type="button" id="modalSaveBtn" class="btn">保存</button>
    </div>
  </div>
</div>

<footer class="site-footer reveal">
  <div class="wrap">Made by MervinLuo</div>
</footer>

<noscript><p style="text-align:center;padding:24px;color:#787774">本页面需要启用 JavaScript 才能运行。</p></noscript>

<script src="app.js"></script>
</body>
</html>
